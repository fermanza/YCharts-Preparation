[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ycharts-interview-lab"
version = "0.1.0"
description = "Financial data reliability and Python interview practice with Django and Airflow"
requires-python = ">=3.11,<3.13"
dependencies = [
  "Django>=5.2,<5.3",
  "pandas>=2.2,<3",
  "numpy>=1.26,<3",
  "celery[redis]>=5.5,<6",
  "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-django>=4.9,<5", "ruff>=0.12,<1"]

[tool.setuptools.packages.find]
include = ["config*", "marketdata*", "practice*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

